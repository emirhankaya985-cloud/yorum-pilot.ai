name: Live demo smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-smoke.yml'
      - 'backend/app/**'
      - 'backend/tests/**'
      - 'frontend/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Backend health endpoint
        run: |
          curl --fail-with-body --retry 16 --retry-delay 10 --retry-all-errors --max-time 40 --silent --show-error \
            "https://yorumpilot-api.onrender.com/healthz" -o /tmp/api-health.json
          python - <<'PY'
          import json
          with open('/tmp/api-health.json') as f: data=json.load(f)
          assert data.get('status')=='ok', data
          assert data.get('google_mode')=='mock', data
          print('Backend healthy and Google remains MOCK_ONLY')
          PY
      - name: Frontend homepage
        run: |
          curl --fail-with-body --retry 16 --retry-delay 10 --retry-all-errors --max-time 40 --silent --show-error \
            "https://yorumpilot-web.onrender.com/" -o /tmp/frontend.html
          grep -iq "yorumpilot" /tmp/frontend.html
          echo 'Frontend homepage HTTP 200 with YorumPilot brand'
      - name: Frontend API proxy
        run: |
          curl --fail-with-body --retry 16 --retry-delay 10 --retry-all-errors --max-time 40 --silent --show-error \
            "https://yorumpilot-web.onrender.com/api/system/status" -o /tmp/system-status.json
          python - <<'PY'
          import json
          with open('/tmp/system-status.json') as f: data=json.load(f)
          assert data.get('mode')=='DEMO', data
          assert data.get('live_google_publish_enabled') is False, data
          assert data.get('database_mode') == 'external_postgresql', data
          assert data.get('ai_provider') == 'rules_mock', data
          assert data.get('customer_data_ready') is False, data
          print('TELEGRAM_BOT_CONFIGURED=' + str(data.get('telegram_bot_configured', False)).lower())
          print('Proxy/Neon persistence configuration PASS; Google publishing disabled; paid AI off')
          PY

      - name: End-to-end synthetic account, dashboard and approval
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import http.cookiejar, json, os, secrets, urllib.request, urllib.error
          cookies = http.cookiejar.CookieJar()
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cookies))
          base = "https://yorumpilot-web.onrender.com/api"
          def call(method, path, payload=None, write=False):
              headers = {}
              body = None if payload is None else json.dumps(payload).encode()
              if payload is not None: headers['Content-Type'] = 'application/json'
              if write:
                  csrf = next((c.value for c in cookies if c.name == 'yp_csrf'), '')
                  assert csrf, "CSRF cookie not set"
                  headers['X-CSRF-Token'] = csrf
              req = urllib.request.Request(base+path,data=body,headers=headers,method=method)
              with client.open(req,timeout=90) as response:
                  return json.load(response)
          # Authentication must be required before any tenant records are disclosed
          try:
              call('GET','/me')
              raise AssertionError('anonymous access should fail')
          except urllib.error.HTTPError as exc:
              assert exc.code == 401, exc.code
          identity = call('POST','/auth/register',{
              'email': 'ci-'+os.environ['RUN_ID']+'@example.invalid',
              'password': secrets.token_urlsafe(24),
              'organization_name': 'YorumPilot CI Sentetik İşletme'
          })
          org = identity['organization_id']
          user = call('GET','/me')
          assert any(o['id']==org for o in user['organizations'])
          dashboard = call('GET',f'/organizations/{org}/dashboard')
          assert dashboard['review_count']==3 and dashboard['source']=='DEMO_DATA', dashboard
          reviews = call('GET',f'/organizations/{org}/reviews')
          assert len(reviews)==3 and all(x['source']=='DEMO_DATA' for x in reviews)
          item = reviews[0]['id']
          assert call('POST',f'/organizations/{org}/reviews/{item}/approve',write=True)['status']=='approved'
          key='ci-key-'+os.environ['RUN_ID']
          published=call('POST',f'/organizations/{org}/reviews/{item}/publish',
              {'confirm':True,'idempotency_key':key},write=True)
          assert published['status']=='simulated_published' and not published['live_google_publish']
          repeated=call('POST',f'/organizations/{org}/reviews/{item}/publish',
              {'confirm':True,'idempotency_key':key},write=True)
          assert repeated['duplicate'] is True
          print('E2E demo: anonymous blocked -> register -> Neon dashboard -> approval -> simulated publish -> dedupe: PASS')
          PY
