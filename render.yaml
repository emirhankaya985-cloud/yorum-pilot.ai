# Zero-cost demo Blueprint template, not automatically applied to existing services.
# A dedicated external Neon Free DATABASE_URL must be provided securely in Render.
# Never attach CareerHunter's database or enable paid services.
services:
  - type: web
    name: yorumpilot-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: GOOGLE_MODE
        value: mock
      - key: AI_PROVIDER
        value: rules
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://yorumpilot-web.onrender.com
  - type: web
    name: yorumpilot-web
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BACKEND_INTERNAL_URL
        value: https://yorumpilot-api.onrender.com
